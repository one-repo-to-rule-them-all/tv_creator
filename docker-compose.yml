services:
  ersatztv:
    image: ghcr.io/ersatztv/legacy:latest
    container_name: ersatztv
    environment:
      - TZ=${TZ:-America/Chicago}
    ports:
      - "${ETV_PORT:-8409}:8409"
    volumes:
      # Persistent config (database, settings, etc.)
      - ${ETV_CONFIG_PATH:-./ersatztv-config}:/config
      # NAS share mounted read-only inside the container at /nas
      # Host path: \\wdmycloud\public (Z: drive)
      # Docker Desktop on Windows: use forward slashes and UNC-style path
      - ${NAS_HOST_PATH:-//wdmycloud/public}:/nas:ro
    # tmpfs: keeps transcoded segments in RAM, saves SSD writes
    tmpfs:
      - /transcode
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8409/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
